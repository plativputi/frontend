name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      # Окружение github-pages пускает деплой только с этой ветки: правило
      # создалось, когда она была дефолтной. Пока правило не обновлено
      # в Settings → Environments, публикует именно этот триггер.
      - claude/repository-access-check-jv5kjn
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
